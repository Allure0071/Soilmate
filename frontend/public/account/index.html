<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#28513b">
  <title>登录 · 沃壤知行</title>
  <link rel="preload" href="/assets/fonts/harmonyos/HarmonyOS_Sans_SC_Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/assets/design-system/typography.css">
  <link rel="stylesheet" href="/assets/design-system/motion.css">
  <style>
    :root{font-family:var(--font-ui);color:#213128;background:#f7f9f6;font-synthesis:none}h1,h2{font-family:var(--font-ui);letter-spacing:-.025em}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9ac5a5;outline-offset:2px}a{color:#286747;text-decoration:none}.header{height:66px;padding:0 clamp(20px,4vw,56px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4ebe4;background:#fff}.brand{display:flex;align-items:center;gap:10px;color:#213128;font-size:16px;font-weight:750}.brand svg{width:33px;height:33px;color:#2b6a48}.back{font-size:12px}.layout{min-height:calc(100vh - 66px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(420px,.9fr)}.story{position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:clamp(38px,5vw,76px);background:#edf3ec;border-right:1px solid #dfe8de}.story:after{content:"";position:absolute;right:-90px;top:35px;width:700px;height:290px;opacity:.35;background:url('../account-design/contours.svg') center/contain no-repeat;pointer-events:none}.story>div{position:relative;z-index:1}.eyebrow{color:#598063;font-size:11px;font-weight:750;letter-spacing:.12em}.story h1{margin:25px 0 17px;max-width:620px;font-size:clamp(38px,4.7vw,62px);line-height:1.17;letter-spacing:-.06em;font-weight:680}.story p{max-width:540px;color:#607365;font-size:14px;line-height:1.8}.story-bottom{max-width:530px;padding-top:20px;border-top:1px solid #d2dfd3}.story-bottom b{font-size:15px}.story-bottom p{margin:6px 0 0;font-size:12px}.form-side{display:flex;align-items:center;justify-content:center;background:#fff;padding:42px 26px}.panel{width:min(100%,390px)}.overline{font-size:11px;color:#89998b}.panel h2{margin:25px 0 6px;font-size:31px;letter-spacing:-.045em}.sub{margin:0 0 25px;color:#758477;font-size:13px;line-height:1.6}.field{margin:16px 0}.field label{display:block;margin:0 0 8px;color:#3d5042;font-size:12px;font-weight:650}.field input{display:block;width:100%;height:45px;padding:0 13px;border:1px solid #dce6dc;border-radius:7px;background:#fff;color:#243b2b;font-size:13px}.field input::placeholder{color:#a3afa5}.field input[aria-invalid=true]{border-color:#bb6759}.field-hint{min-height:17px;margin:6px 0 0;color:#9c554c;font-size:11px}.password-wrap{position:relative}.password-wrap input{padding-right:60px}.password-wrap button{position:absolute;right:5px;top:5px;height:35px;padding:0 10px;border:0;background:transparent;color:#52715a;font-size:11px}.primary{width:100%;min-height:45px;margin-top:14px;border:0;border-radius:8px;background:#286747;color:#fff;font-size:13px;font-weight:700}.primary:hover{background:#20563b}.primary:disabled{opacity:.65;cursor:wait}.switch{margin:21px 0 0;text-align:center;color:#7d8b80;font-size:12px}.switch button{border:0;background:transparent;color:#286747;font-size:12px;font-weight:700}.error{margin:0 0 9px;padding:10px 12px;border-radius:6px;background:#fbf0ed;color:#975247;font-size:12px;line-height:1.5}.footnote{margin:23px 0 0;color:#8b998c;font-size:11px;line-height:1.6}.view[hidden]{display:none}.form-side a:hover,.back:hover{text-decoration:underline}@media(max-width:850px){.layout{grid-template-columns:1fr}.story{min-height:230px;padding:32px 27px}.story h1{margin:13px 0 8px;font-size:38px}.story p{font-size:12px}.story-bottom{display:none}.form-side{padding:35px 25px 55px}}@media(max-width:480px){.header{height:58px;padding:0 18px}.brand{font-size:15px}.brand svg{width:29px;height:29px}.layout{min-height:calc(100vh - 58px)}.story{min-height:182px;padding:25px 22px}.story h1{font-size:29px}.story p{line-height:1.5}.form-side{align-items:flex-start;padding:30px 22px 45px}.panel h2{margin-top:17px;font-size:27px}}
  </style>
  <link rel="stylesheet" href="/account/theme.css">
  <link rel="stylesheet" href="/assets/design-system/surfaces.css">
</head>
<body>
  <main class="layout"><section class="story" aria-label="研究工作区说明"><div><span class="eyebrow">沃壤知行 / 研究工作区</span><h1>从这里，<br>继续你的研究。</h1><p>保存项目，管理样本，追溯研究。</p></div></section>
    <section class="form-side" aria-label="账号登录与注册"><div class="panel"><div class="panel-top"><span class="overline">沃壤知行 / 研究账号</span><a class="back" href="/">返回首页 ↗</a></div><p id="api-error" class="error" role="alert" hidden></p>
      <form id="login-form" class="view" autocomplete="on"><h2>欢迎回来</h2><p class="sub">登录后继续你的研究项目。</p><div class="field"><label for="login-email">邮箱地址</label><input id="login-email" type="email" name="email" autocomplete="username" placeholder="name@institute.edu" required><p class="field-hint" id="login-email-error"></p></div><div class="field"><label for="login-password">密码</label><div class="password-wrap"><input id="login-password" type="password" name="password" autocomplete="current-password" required><button type="button" data-toggle="login-password" aria-label="显示密码">显示</button></div><p class="field-hint" id="login-password-error"></p></div><button class="primary" type="submit">登录</button><p class="switch">还没有账号？<button type="button" data-view="register">创建账号</button></p><details class="footnote"><summary>无法登录？</summary><p>忘记密码请联系站点管理员；本站未配置恢复邮件。</p></details></form>
      <form id="register-form" class="view" autocomplete="on" hidden><h2>创建研究账号</h2><p class="sub" id="register-sub">使用邮箱创建工作区。</p><div class="field"><label for="register-email">邮箱地址</label><input id="register-email" type="email" name="email" autocomplete="username" placeholder="name@institute.edu" required><p class="field-hint" id="register-email-error"></p></div><div class="field"><label for="register-password">设置密码</label><div class="password-wrap"><input id="register-password" type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="button" data-toggle="register-password" aria-label="显示密码">显示</button></div><p class="field-hint" id="register-password-error"></p></div><button class="primary" type="submit">创建账号</button><p class="switch">已有账号？<button type="button" data-view="login">返回登录</button></p><p class="footnote">密码至少 12 位。本站未配置邮箱验证。</p></form>
    </div></section>
  </main>
  <script type="module">
    import { accountDestination } from './redirect.js';
    import { authErrorMessage } from './errors.js';
    const loginForm=document.getElementById('login-form');
    const registerForm=document.getElementById('register-form');
    const apiError=document.getElementById('api-error');
    const nextPath=new URLSearchParams(location.search).get('next');
    const destination=accountDestination(nextPath);
    function view(which){loginForm.hidden=which!=='login';registerForm.hidden=which!=='register';apiError.hidden=true;history.replaceState(null,'',location.pathname+location.search+'#'+which);document.title=(which==='login'?'登录':'注册')+' · 沃壤知行'}
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>view(button.dataset.view)));
    document.querySelectorAll('[data-toggle]').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.toggle);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'显示':'隐藏';button.setAttribute('aria-label',button.textContent+'密码')}));
    async function submit(form,endpoint){
      apiError.hidden=true;
      const button=form.querySelector('button[type=submit]');button.disabled=true;
      const payload={email:form.elements.email.value.trim(),password:form.elements.password.value};
      try{const response=await fetch('/api/auth/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(authErrorMessage(response.status,data));location.assign(destination)}catch(error){apiError.textContent=error instanceof TypeError?'无法连接登录服务，请检查本地后端是否启动':error.message||'连接失败，请稍后重试';apiError.hidden=false;apiError.scrollIntoView({block:'nearest'})}finally{button.disabled=false}
    }
    loginForm.addEventListener('submit',event=>{event.preventDefault();submit(loginForm,'login')});
    registerForm.addEventListener('submit',event=>{event.preventDefault();submit(registerForm,'register')});
    const requestedView=location.hash==='#register'?'register':location.hash==='#login'?'login':null;
    view(requestedView||'login');
    if(!requestedView)fetch('/api/auth/status',{credentials:'same-origin'}).then(response=>response.ok?response.json():null).then(data=>{if(data&&!data.has_accounts){document.getElementById('register-sub').textContent='这是本站第一个账号。填写你的邮箱和密码，创建后即可进入工作区。';view('register')}}).catch(()=>{});
  </script>
</body>
</html>
